# A tool whose value proposition is a CI drift gate should run its own tests on every push.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Deliberately version-agnostic: this string is the required status check in branch
    # protection, so baking the Node version into it means every future bump silently blocks
    # every PR on a check that no longer runs.
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tested ABOVE the floor, on purpose. `engines` says >=22.12 (sqlite-wasm demands >=22;
      # the .12 is where unflagged require(esm) landed, which the exports map needs for CJS
      # consumers). Node 24 is LTS and inside that range, so testing here catches breakage on
      # what people actually run, while release.yml stays on 22 — between them both ends of the
      # supported range get exercised without a second billed job.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm test

      # DOGFOOD. The tool, run on the tool's own store, using THIS COMMIT's source rather than a
      # published version. That is the point: a released version lags by definition, so gating on
      # one would test what we shipped last time instead of what we are shipping now. `node
      # src/cli.js` is always the newest gitdata that exists.
      #
      # It is also the only gate here that reads `data/`. `npm test` builds its own fixture repos
      # in temp dirs and never touches this repo's rows, so without these two lines gitdata's own
      # store could rot exactly the way a consumer's does — and we would be shipping a drift gate
      # while carrying undetected drift.
      #
      # Run bare, exit code read directly. Not piped: `$?` after a pipeline is the pipe's status,
      # not the command's, which is how a green gate over a red command happens.
      - name: Dogfood — this repo's own store passes its own gates
        run: |
          node src/cli.js validate --root .
          node src/cli.js rollup --check --root .
