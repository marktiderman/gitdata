# The ideas board — generated from data/ideas/*.md, never hand-written.
#
# Declared with shapes rather than SQL, which is also the point of it existing: this repo's own
# board is a worked example, and if it needed a `compile:` escape hatch that would be evidence a
# shape is missing.
kind: view-spec
id: ideas-board
out: data/_views/ideas-board.md

queries:
  stats:
    shape: digest
    counts:
      total: { from: ideas }
      open: { from: ideas, where: { state: open } }
      became: { from: ideas, where: { state: became } }
      declined: { from: ideas, where: { state: declined } }
    blocks:
      - text: "**{total} ideas** · {open} open · {became} became work · {declined} declined"

  body:
    shape: sections
    sections:
      # `empty:` is declared on purpose. A section that vanishes when it has no rows is right for
      # a board of work in flight; for ideas, "nothing here" is information — it says the backlog
      # is genuinely empty rather than that the query broke.
      - heading: ["", "## Open"]
        from: ideas
        where: { state: open }
        order: { by: id }
        columns: &cols
          - { from: id, as: id }
          - { from: title, as: title }
          - { from: solves, collapse: true, truncate: 130, as: solves }
          - { from: raised, collapse: true, truncate: 90, as: raised }
        empty: "| — | nothing open | — | — |"

      - heading: ["", "## Became work"]
        from: ideas
        where: { state: became }
        order: { by: id }
        columns:
          - { from: id, as: id }
          - { from: title, as: title }
          - { from: became, as: became }
          - { from: solves, collapse: true, truncate: 110, as: solves }
        empty: "| — | nothing yet | — | — |"

      - heading: ["", "## Declined"]
        from: ideas
        where: { state: declined }
        order: { by: id }
        columns:
          - { from: id, as: id }
          - { from: title, as: title }
          - { from: verdict, collapse: true, truncate: 160, as: verdict }
        empty: "| — | nothing declined | — |"

template: |
  <!-- DERIVED VIEW — generated by `gitdata rollup` from data/ideas/*.md.
       Do not hand-edit: `gitdata rollup --check` will fail if you do. -->
  # Ideas

  {{stats}}

  Good ideas nobody is building yet, and the record of the ones we decided against. `solves` is the
  field that earns a row: an idea that cannot name the problem it removes is a preference.
  {{body}}
