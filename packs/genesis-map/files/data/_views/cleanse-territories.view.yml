# The cascading territory map as a gitdata view — replaces the core of
# scripts/harness/cleanse-refresh.py (998 lines).
#
# This is the hardest view in Genesis and the real test of the SQL thesis. It needs four things at
# once: a recursive parent→child walk, a UNION of two different tables (features + principles),
# a mapped status label, and a column derived from FILE BODY text rather than frontmatter.
#
# Everything Genesis-specific lives here — territory names, the 'ratified' → 'agent-proposed'
# mapping, which body heading holds the summary. The engine contributes only generic primitives:
# md_section() knows what a markdown section is, natural_key() knows what a dotted id is.
kind: view-spec
id: cleanse-territories
out: data/_views/cleanse-territories.md

queries:
  # Emitted as lines rather than scalars because both blocks end in a markdown hard break —
  # two trailing spaces, which a YAML block scalar would strip from the template.
  summary: |
    SELECT '**Features:** ' || (SELECT COUNT(*) FROM features)
        || ' · **agent-proposed:** ' || (SELECT COUNT(*) FROM features WHERE cleanse = 'ratified')
        || ' · **needs-clarify:** ' || (SELECT COUNT(*) FROM features
                                         WHERE cleanse <> 'ratified' OR cleanse IS NULL)
        || '  ' AS line
    UNION ALL
    SELECT '**Principles:** ' || (SELECT COUNT(*) FROM principles) || ' (under Way → Principles)'

  intro: |
    SELECT 'Live query over `data/features/*.md` + `data/principles/*.md` frontmatter.  ' AS line
    UNION ALL
    SELECT '`parent` drives the cascade. Refresh: `bash scripts/harness/genesis cleanse refresh`'

  # One query emits every line of the body: section headers, tree rows, and orphan warnings,
  # interleaved by a composite sort of (territory, block, path).
  body: |
    WITH RECURSIVE
    territory(root, name) AS (
      VALUES ('1','The Genesis Way'), ('2','Packages'), ('3','Harness (CCP)'), ('4','Factory')
    ),
    -- features and principles as one node set; principles hang under Way → Principles (GEN-207)
    -- at coords computed from their numbering, exactly as the reference implementation injects them.
    node AS (
      -- `seg` is this node's sort key among its siblings. Two parts matter:
      --   · the trailing id makes ties deterministic — the reference loads files in filename
      --     order and sorts stably, so equal coords keep id order. Live case: two ratified
      --     features share `3.1.1.8.x.invention`, two more share `3.6.x.invention`.
      --   · principles get a '2' prefix (natural_key emits '0' for numeric segments and '1' for
      --     non-numeric), so injected principles sort after EVERY real feature child of GEN-207,
      --     matching emit_tree(), which recurses through feature children first and only then
      --     appends prin_by_parent. (Codex P2, PR #356.)
      SELECT id, slug, type, parent, coord,
             CASE WHEN cleanse = 'ratified' THEN 'agent-proposed' ELSE 'needs-clarify' END AS stamp,
             replace(substr(md_section(_body, 'The job'), 1, 160), '|', '/') AS job,
             natural_key(coord) || ' ' || id AS seg
      FROM features
      UNION ALL
      SELECT number, id, 'principle', 'GEN-207',
             '1.2.' || row_number() OVER (ORDER BY number, id),
             CASE WHEN cleanse = 'ratified' THEN 'agent-proposed' ELSE 'needs-clarify' END,
             replace(substr(title, 1, 160), '|', '/'),
             '2' || natural_key('1.2.' || row_number() OVER (ORDER BY number, id)) || ' ' || number
      FROM principles
    ),
    -- `origin` is the territory of the ROOT this walk started from, carried down the recursion.
    -- A row renders under the territory it was REACHED from, not under its own coordinate — the
    -- reference emits each territory's cascade by recursing from that territory's roots, so a
    -- feature whose parent lives in another territory appears inside the PARENT's territory (and
    -- is separately flagged as an orphan in its own). (Codex P2, PR #356.)
    tree AS (
      SELECT id, slug, type, coord, stamp, job, 0 AS depth, seg AS path,
             substr(coord, 1, instr(coord || '.', '.') - 1) AS origin
      FROM node WHERE parent IS NULL OR parent IN ('null','None','')
      UNION ALL
      SELECT n.id, n.slug, n.type, n.coord, n.stamp, n.job, t.depth + 1,
             t.path || '/' || n.seg, t.origin
      FROM node n JOIN tree t ON n.parent = t.id
    ),
    rooted AS (SELECT *, origin AS root FROM tree),
    counted AS (
      SELECT t.root, t.name,
             (SELECT COUNT(*) FROM features f
               WHERE substr(f.coord, 1, instr(f.coord || '.', '.') - 1) = t.root) AS n
      FROM territory t
    ),
    header(seq, tmpl) AS (
      VALUES (0, ''), (1, '## {root} · {name}'), (2, ''),
             (3, '_{n} dots in territory · cascade by `parent`_'), (4, ''),
             (5, '| tree / coord | id | slug | type | stamp | job |'),
             (6, '| --- | --- | --- | --- | --- | --- |')
    )
    SELECT line FROM (
      SELECT c.root AS root, 0 AS block, printf('%03d', h.seq) AS path,
             replace(replace(replace(h.tmpl, '{root}', c.root), '{name}', c.name),
                     '{n}', CAST(c.n AS TEXT)) AS line
      FROM counted c CROSS JOIN header h

      UNION ALL

      SELECT r.root, 1, r.path,
             '| ' || CASE WHEN r.depth = 0 THEN '' ELSE replace(hex(zeroblob(r.depth)), '00', '—') || ' ' END
                  || '`' || r.coord || '` | ' || r.id || ' | ' || r.slug || ' | '
                  || r.type || ' | ' || r.stamp || ' | ' || r.job || ' |'
      FROM rooted r

      UNION ALL

      -- A feature inside a territory that THAT territory's cascade never reached — its parent is
      -- missing, or lives in another territory. Listed rather than silently dropped. Reachability
      -- is per-territory (`origin`), not global: the reference rebuilds `visited` inside each
      -- territory's loop, so a cross-territory child is an orphan HERE even though it rendered
      -- normally under its parent's territory.
      --
      -- Ordered by RAW coord, not natural_key: the reference sorts its orphan list with plain
      -- string comparison, so `1.10` precedes `1.2` here even though the cascade above orders
      -- them naturally. Reproducing the source beats making it consistent. (Codex P2, PR #356.)
      SELECT substr(f.coord, 1, instr(f.coord || '.', '.') - 1), 2, f.coord || ' ' || f.id,
             '| ⚠ `' || f.coord || '` | ' || f.id || ' | ' || f.slug || ' | ' || f.type || ' | '
                  || CASE WHEN f.cleanse = 'ratified' THEN 'agent-proposed' ELSE 'needs-clarify' END
                  || ' | parent=' || COALESCE(f.parent, '') || ' · '
                  || replace(substr(md_section(f._body, 'The job'), 1, 160), '|', '/') || ' |'
      FROM features f
      WHERE substr(f.coord, 1, instr(f.coord || '.', '.') - 1) IN (SELECT root FROM territory)
        AND NOT EXISTS (
          SELECT 1 FROM tree t
           WHERE t.id = f.id
             AND t.origin = substr(f.coord, 1, instr(f.coord || '.', '.') - 1)
        )
    )
    ORDER BY root, block, path

template: |+
  <!-- DERIVED VIEW: regenerated by scripts/harness/cleanse-refresh.py — do not hand-edit. -->
  # Genesis map — four territories (cascading)

  {{summary}}

  {{intro}}

  {{body}}

  ## Regenerate

  ```bash
  bash scripts/harness/genesis cleanse refresh
  # or: python3 scripts/harness/cleanse-refresh.py
  ```

