# The cleanse board as a gitdata view — replaces scripts/harness/cleanse-board.py (116 lines).
#
# NOTE the sort: this board orders coords as PLAIN STRINGS (`1.10` before `1.2`), unlike
# cleanse-territories which orders them naturally. That difference is real in the reference
# implementation, so it is preserved here rather than "fixed" — a rollup reproduces its source,
# it does not improve it. Changing the sort is a content decision for the operator, not drift.
kind: view-spec
id: cleanse-board
out: data/_views/cleanse-board.md

queries:
  # Two lines, emitted as data because the first ends in a markdown hard break (two trailing
  # spaces) that a YAML block scalar would strip.
  summary: |
    SELECT '**Features:** '   || (SELECT COUNT(*) FROM features   WHERE cleanse =  'ratified')
        || ' ratified · '     || (SELECT COUNT(*) FROM features   WHERE cleanse IS NOT 'ratified')
        || ' pending · '      || (SELECT COUNT(*) FROM features)   || ' total  ' AS line
    UNION ALL
    SELECT '**Principles:** ' || (SELECT COUNT(*) FROM principles WHERE cleanse =  'ratified')
        || ' ratified · '     || (SELECT COUNT(*) FROM principles WHERE cleanse IS NOT 'ratified')
        || ' pending · '      || (SELECT COUNT(*) FROM principles) || ' total'

  # One query emits every body line. Section headings are rows too, so a section with no matching
  # records collapses cleanly instead of leaving a stray blank line behind.
  body: |
    WITH
    prow AS (
      -- `id` is the principle's slug and doubles as its filename stem, so ordering by it
      -- reproduces the reference's stable filename order when `number` ties.
      SELECT cleanse, number, id,
             '| ' || number || ' | ' || id || ' | ' || COALESCE(title,'') || ' |' AS line
      FROM principles
    ),
    frow AS (
      SELECT cleanse, coord, id,
             '| `' || COALESCE(coord,'?') || '` | ' || id || ' | ' || COALESCE(slug,'?') || ' | '
                   || COALESCE(type,'?') || ' | ' || COALESCE(version,'—') || ' |' AS line
      FROM features
    ),
    heading(block, seq, line) AS (
      VALUES (0,0,'## Agent-proposed (cleanse: ratified)'), (0,1,''), (0,2,'### Principles'), (0,3,''),
             (0,4,'| number | id | title |'), (0,5,'| --- | --- | --- |'),
             (2,0,''), (2,1,'### Features'), (2,2,''),
             (2,3,'| coord | id | slug | type | version |'), (2,4,'| --- | --- | --- | --- | --- |'),
             (4,0,''), (4,1,'## Not yet (pending)'), (4,2,''), (4,3,'### Principles'), (4,4,''),
             (4,5,'| number | id | title |'), (4,6,'| --- | --- | --- |'),
             (6,0,''), (6,1,'### Features'), (6,2,''),
             (6,3,'| coord | id | slug | type | version |'), (6,4,'| --- | --- | --- | --- | --- |')
    )
    -- Sort keys append the id after a SPACE, which is what makes ties deterministic. The Python
    -- reference loads files in filename order and sorts stably, so equal coords keep id order;
    -- ORDER BY coord alone would leave SQLite free to return tied rows in insertion order and CI
    -- could report drift at random. This is live, not hypothetical: `3.1.1.8.x.invention` and
    -- `3.6.x.invention` are each shared by two ratified features. Space (0x20) sorts before '.'
    -- and before every digit, so appending it never disturbs prefix ordering. (Codex P2, PR #356.)
    SELECT line FROM (
      SELECT block, printf('%03d', seq) AS sortkey, line FROM heading
      UNION ALL
      SELECT 1, COALESCE(number,'') || ' ' || id,   line FROM prow WHERE cleanse =  'ratified'
      UNION ALL
      SELECT 3, COALESCE(coord,'')  || ' ' || id,   line FROM frow WHERE cleanse =  'ratified'
      UNION ALL
      SELECT 5, COALESCE(number,'Z') || ' ' || id,  line FROM prow WHERE cleanse IS NOT 'ratified'
      UNION ALL
      SELECT 7, COALESCE(coord,'9') || ' ' || id,   line FROM frow WHERE cleanse IS NOT 'ratified'

      -- The reference emits an explicit placeholder when a RATIFIED section is empty (the pending
      -- sections have none). Without these, a cycle with nothing ratified yet would render a bare
      -- table header here and a `_(none yet)_` row there. (Codex P2, PR #356.)
      UNION ALL
      SELECT 1, 'zzz', '| — | — | _(none yet)_ |'
        WHERE NOT EXISTS (SELECT 1 FROM prow WHERE cleanse = 'ratified')
      UNION ALL
      SELECT 3, 'zzz', '| — | — | — | — | _(none yet)_ |'
        WHERE NOT EXISTS (SELECT 1 FROM frow WHERE cleanse = 'ratified')
    )
    ORDER BY block, sortkey

template: |+
  <!-- DERIVED VIEW: regenerated by scripts/harness/cleanse-board.py — do not hand-edit rows. -->
  # Cleanse board — Genesis map (2026-07 cycle)

  {{summary}}

  Trusted fields: `type` · `coord` · `version` · `cleanse`. See `docs/working/genesis-cleanse/CONTRACT.md`.

  {{body}}

