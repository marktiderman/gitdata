# The features board — generated from data/features/*.md, never hand-written.
#
# This file is YOURS. Change the columns, the grouping, the wording; add a view of your own
# beside it. The engine only knows how to query and render — what a "feature" is, and which
# statuses matter, is decided here.
kind: view-spec
id: features-board
out: data/_views/features-board.md

queries:
  totals: |
    SELECT COUNT(*)                                   AS total,
           SUM(status = 'shipped')                    AS shipped,
           SUM(status IN ('planned','building'))      AS active,
           SUM(priority = 'P0' AND status <> 'shipped') AS urgent
    FROM features

  # One query emits the whole body. Status headings are rows too, so a status with no features
  # disappears entirely rather than leaving an empty heading behind.
  body: |
    WITH
    stage(rank, status, heading) AS (
      VALUES (1,'building','## Building'), (2,'planned','## Planned'),
             (3,'idea','## Ideas'),        (4,'shipped','## Shipped')
    ),
    row AS (
      SELECT COALESCE(status,'idea') AS status, COALESCE(priority,'P3') AS priority, id,
             '| ' || COALESCE(priority,'P3') || ' | ' || id || ' | ' || COALESCE(title, id)
                  || ' | ' || COALESCE(owner,'—') || ' | '
                  || substr(md_section(_body, 'The job'), 1, 120) || ' |' AS line
      FROM features
    )
    SELECT line FROM (
      SELECT s.rank, 0 AS block, '' AS sortkey, s.heading AS line
        FROM stage s WHERE EXISTS (SELECT 1 FROM row WHERE row.status = s.status)
      UNION ALL
      SELECT s.rank, 1, '', '' FROM stage s WHERE EXISTS (SELECT 1 FROM row WHERE row.status = s.status)
      UNION ALL
      SELECT s.rank, 2, '', '| priority | id | title | owner | the job |'
        FROM stage s WHERE EXISTS (SELECT 1 FROM row WHERE row.status = s.status)
      UNION ALL
      SELECT s.rank, 3, '', '| --- | --- | --- | --- | --- |'
        FROM stage s WHERE EXISTS (SELECT 1 FROM row WHERE row.status = s.status)
      UNION ALL
      SELECT s.rank, 4, r.priority || ' ' || r.id, r.line
        FROM row r JOIN stage s ON s.status = r.status
      UNION ALL
      SELECT s.rank, 5, '', '' FROM stage s WHERE EXISTS (SELECT 1 FROM row WHERE row.status = s.status)
    )
    ORDER BY rank, block, sortkey

template: |
  <!-- DERIVED VIEW — generated by `gitdata rollup` from data/features/*.md.
       Do not hand-edit: `gitdata rollup --check` will fail if you do. -->
  # Features

  **{{totals.total}} features** · {{totals.active}} in flight · {{totals.shipped}} shipped · {{totals.urgent}} P0 outstanding

  {{body}}
