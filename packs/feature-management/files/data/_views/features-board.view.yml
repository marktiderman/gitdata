# The features board — generated from data/features/*.md, never hand-written.
#
# Declared with shapes rather than SQL: you say what your rows mean, the engine supplies the
# mechanics. This file is YOURS — change the columns, the headings, the wording; add a view of
# your own beside it.
kind: view-spec
id: features-board
out: data/_views/features-board.md

queries:
  # `counts:` resolves each name once; `{name}` interpolates it into the line.
  stats:
    shape: digest
    counts:
      total: { from: features }
      active: { from: features, where: { status: { in: [planned, building] } } }
      shipped: { from: features, where: { status: shipped } }
      urgent: { from: features, where: { priority: P0, status: { not: shipped } } }
    blocks:
      - text: "**{total} features** · {active} in flight · {shipped} shipped · {urgent} P0 outstanding"

  # A section whose query returns nothing disappears, heading and all — a heading over zero rows
  # is drift. Ideas declares `empty:` because an empty backlog is worth saying out loud.
  body:
    shape: sections
    sections:
      - heading: ["", "## Building"]
        from: features
        where: { status: building }
        order: { by: priority, tie_break: id }
        columns: &cols
          - { from: priority, as: priority }
          - { from: id, as: id }
          - { from: title, as: title }
          - { from: owner, as: owner }
          - { from: body, section: The job, truncate: 120, as: the job }

      - heading: ["", "## Planned"]
        from: features
        where: { status: planned }
        order: { by: priority, tie_break: id }
        columns: *cols

      - heading: ["", "## Ideas"]
        from: features
        where: { status: idea }
        order: { by: priority, tie_break: id }
        columns: *cols
        empty: "| — | — | nothing queued | — | — |"

      - heading: ["", "## Shipped"]
        from: features
        where: { status: shipped }
        order: { by: id }
        columns: *cols

template: |
  <!-- DERIVED VIEW — generated by `gitdata rollup` from data/features/*.md.
       Do not hand-edit: `gitdata rollup --check` will fail if you do. -->
  # Features

  {{stats}}
  {{body}}
