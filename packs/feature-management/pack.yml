# feature-management — track what your product does, as data in git.
#
# The starter pack: the smallest table worth having, plus a board generated from it. Deliberately
# plain — no numbering scheme, no workflow stamps, no coordinates — so it reads as an example
# rather than as somebody else's process.
#
# Everything this installs is YOURS. Edit the template, rewrite the view, add fields. The engine
# discovers columns from your rows — it never requires a field you did not want.
name: feature-management
version: 0.1.0
requires: ">=0.1.0" # engine versions this pack is known to work with
title: Feature management
description: >
  A features table and a self-updating board. Every feature is one markdown file with
  frontmatter; the board is generated from those files and can never disagree with them.

tables:
  - features

installs:
  - data/features/_template.md      # the exemplar to copy for a new feature
  - data/features/README.md         # what a row means
  - data/_views/features-board.view.yml
  - data/_schema/features.schema.yml # required/unique/enum/pattern/ref — `gitdata validate` reads this

# After install:
#   cp data/features/_template.md data/features/F-001--my-feature.md   (then edit it)
#   npx github:marktiderman/gitdata rollup                              (writes the board)
#   npx github:marktiderman/gitdata rollup --check                      (CI: has it drifted?)
#   npx github:marktiderman/gitdata validate                            (CI: does every row hold up?)
#
# Use the github: spec until the scoped package is actually published — @marktiderman/gitdata is
# not on the registry yet, and instructions that 404 teach people to improvise. Never the bare
# name: unscoped `gitdata` on npm is an unrelated 2016 package by another author — the bare
# command fetches and runs a stranger's code, in a pack, on somebody else's machine, on our
# instruction. test/boundaries.test.js keeps this from coming back.
